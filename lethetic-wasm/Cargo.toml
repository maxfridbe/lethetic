[package]
name = "lethetic-wasm"
version = "26.1026.5"
edition = "2024"
description = "Portable Lethetic conversation and tool orchestration runtime"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = "=0.2.128"
lethetic = { path = "..", default-features = false }
