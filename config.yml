server_url: http://brainiac-nvidia:7210/v1/responses
model: Gemma-4-26B-TurboQuant-262k
context_size: 262144
estimate_cost: true
context_mode: lethetic


model_servers:
  - name: Gemma 4 26B
    url: http://brainiac-nvidia:7210/v1/responses
    model: Gemma-4-26B-TurboQuant-262k
    parser: gemma4
    theme: GitHub Light
  - name: Qwen3 27B MTP
    url: http://brainiac-nvidia:7211/v1/responses
    model: Qwen3-27B-MTP-Q4
    parser: qwen3
  - id: local-claude-code-proxy
    name: Claude Code Proxy (Local)
    kind: claude_code_proxy
    url: http://127.0.0.1:18765
    model: gpt-5.6-sol
    parser: default
    api_key: claudecodex-local
    context_size: 262144 # legacy fallback for discovered models without exact metadata
    context_limits:
      applies_to_models: [gpt-5.6-sol]
      total_context_tokens: 1050000
      maximum_input_tokens: 922000
      maximum_output_tokens: 128000
      request_output_tokens: 24576
      lethetic_input_budget_tokens: 900000
    thinking: true
    extra_body:
      output_config:
        effort: max
    pricing:
      applies_to_models: [gpt-5.6-sol]
      currency: USD
      unit_tokens: 1000000
      effective_as_of: 2026-08-25
      valid_through: 2026-11-21
      provenance:
        kind: api_equivalent_estimate
        url: https://developers.openai.com/api/docs/models/gpt-5.6-sol
        note: OAuth/Codex subscription or credit billing may differ.
      rates:
        uncached_input: 4.00
        cached_read_input: 0.40
        cache_creation_input: 5.00
        output: 20.00
      long_context:
        threshold_input_tokens: 272000
        applies_above_threshold: true
        input_multiplier: 2.0
        output_multiplier: 1.5
  - name: DeepSeek V4 (Azure)
    # url and api_key live in config.local.yml (gitignored)
    model: DeepSeek-V4-Pro
    parser: qwen3
    input_cost_per_1m: 1.74
    output_cost_per_1m: 3.48
    context_size: 1000000
    thinking: true
    extra_body:
      reasoning_effort: high
    theme: Monokai
