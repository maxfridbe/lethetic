name: Rust checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript for the embedded UI
        run: npm install --global typescript@7.0.2
      - uses: Swatinem/rust-cache@v2
      - name: Central version and packaging checks
        run: |
          python3 scripts/release_version.py --check
          python3 scripts/test_release_version.py
          python3 scripts/test_android_release.py
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (workspace and browser target)
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p lethetic-wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Validate generated web assets and contracts
        run: |
          python3 scripts/test_build_web_assets.py
          ./build-web.sh --check
      - name: Native and WASM unit tests, local integration tests
        run: python3 scripts/ci_run.py python3 scripts/test_rust.py
      - name: Build isolated C# runtime (no host SDK)
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman build -t localhost/lethetic-dotnet-runtime:dev runtime/dotnet
      - name: Isolated C# runspace integration
        env:
          LETHETIC_DOTNET: /does-not-exist/no-host-sdk
        run: python3 scripts/ci_run.py cargo test --test test_dotnet_native --locked -- --include-ignored
      - name: Source size policy
        run: |
          python3 scripts/test_check_source_lines.py
          python3 scripts/check_source_lines.py
