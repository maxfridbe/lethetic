name: Native Web UI
on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
    paths: ['native/**', 'browser/**', 'web/**', 'lethetic-wasm/**', 'src/engine/**', 'src/storage/**', 'scripts/prepare_native.py', 'scripts/package_native_release.py', 'scripts/*android_release.py', 'scripts/*release_version.py', 'VERSION', 'Cargo.toml', 'gemma-chat/Cargo.toml', 'build-browser.sh', '.github/workflows/native.yml', 'Cargo.lock']
  pull_request:
    paths: ['native/**', 'browser/**', 'scripts/prepare_native.py', 'scripts/package_native_release.py', 'scripts/*android_release.py', 'scripts/*release_version.py', 'VERSION', 'Cargo.toml', 'gemma-chat/Cargo.toml', '.github/workflows/native.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      - run: npm install --global typescript@7.0.2
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Build shared frontend
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then export LETHETIC_RELEASE_VERSION="$RELEASE_REF"; fi
          ./build-browser.sh
      - run: python3 scripts/prepare_native.py
      - run: python3 scripts/test_android_release.py
      - run: python3 scripts/test_release_version.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-frontend
          path: native/dist
          include-hidden-files: true
  desktop:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend
          path: native/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - run: cargo test -p lethetic-directory --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo tauri build --bundles ${{ runner.os == 'Windows' && 'nsis' || runner.os == 'macOS' && 'app,dmg' || 'deb,appimage' }}
      - uses: actions/upload-artifact@v4
        with:
          name: lethetic-${{ runner.os }}
          if-no-files-found: error
          path: |
            native/target/release/bundle/**/*.deb
            native/target/release/bundle/**/*.AppImage
            native/target/release/bundle/**/*.exe
            native/target/release/bundle/**/*.dmg
  android:
    needs: frontend
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.package.outputs.signed }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend
          path: native/dist
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up supported Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          # The legacy "tools" package requested by v3 is no longer published.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - run: cargo tauri android init --ci
      - name: Install Lethetic adaptive and themed launcher icons
        run: cp -R src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
      - name: Build optimized Android release APK
        run: cargo tauri android build --target aarch64 --apk
      - name: Android system bars, keyboard and cutout regression tests
        run: ./src-tauri/gen/android/gradlew -p src-tauri/gen/android :tauri-plugin-lethetic-host:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-inset-test-results
          path: native/host/android/build/test-results/testDebugUnitTest/
      - name: Verify and sign tagged APK
        id: package
        env:
          ANDROID_KEYSTORE_BASE64: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          signed=false
          if [[ "$GITHUB_REF" == refs/tags/* && -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            python3 ../scripts/android_release.py --sign
            signed=true
          else
            python3 ../scripts/android_release.py
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::warning::Android APK not published: configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD, then rerun this workflow on the release tag."
              echo "Android publication skipped: release signing secrets are incomplete. Other platform downloads publish independently." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.signed == 'true' && 'lethetic-Android' || 'lethetic-Android-unsigned' }}
          if-no-files-found: error
          path: native/android-release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lethetic-*
          path: native-artifacts
      - run: python3 scripts/release_version.py --check
      - name: Validate installers and generate checksums
        run: python3 scripts/package_native_release.py native-artifacts native-release --group desktop
      - name: Publish native installers to the shared release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: native-release/*
          name: Lethetic ${{ github.ref_name }}
          append_body: true
          body: |
            Native Web UI downloads: Windows `.exe`, macOS `.dmg`, and Linux `.deb` / `.AppImage`. Each installer includes a SHA-256 checksum.

            Desktop installers are not signed/notarized with publisher certificates. Android is published separately only after release signing is configured; if no APK is listed, see [Android signing setup](https://github.com/maxfridbe/lethetic/blob/${{ github.ref_name }}/docs/how-to/native-web-ui.md#android-release-signing-setup).

  release-android:
    if: startsWith(github.ref, 'refs/tags/v') && needs.android.outputs.signed == 'true'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lethetic-Android
          path: native-artifacts/lethetic-Android
      - run: python3 scripts/release_version.py --check
      - name: Package verified Android installer
        run: python3 scripts/package_native_release.py native-artifacts android-release --group android
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: android-release/*
          name: Lethetic ${{ github.ref_name }}
          append_body: true
          body: |
            Android ARM64: the APK is an optimized, non-debuggable build signed with the project's persistent release key. Its SHA-256 checksum is included.
