name: Native Web UI
on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*', 'browser-v*']
    paths: ['native/**', 'browser/**', 'web/**', 'lethetic-wasm/**', 'src/engine/**', 'src/storage/**', 'scripts/prepare_native.py', 'scripts/package_native_release.py', 'scripts/*android_release.py', 'build-browser.sh', '.github/workflows/native.yml', 'Cargo.lock']
  pull_request:
    paths: ['native/**', 'browser/**', 'scripts/prepare_native.py', 'scripts/package_native_release.py', 'scripts/*android_release.py', '.github/workflows/native.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      - run: npm install --global typescript@7.0.2
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Build shared frontend
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then export LETHETIC_RELEASE_VERSION="$RELEASE_REF"; fi
          ./build-browser.sh
      - run: python3 scripts/prepare_native.py
      - run: python3 scripts/test_android_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-frontend
          path: native/dist
          include-hidden-files: true
  desktop:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend
          path: native/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - run: cargo test -p lethetic-directory --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo tauri build --bundles ${{ runner.os == 'Windows' && 'nsis' || runner.os == 'macOS' && 'app,dmg' || 'deb,appimage' }}
      - uses: actions/upload-artifact@v4
        with:
          name: lethetic-${{ runner.os }}
          if-no-files-found: error
          path: |
            native/target/release/bundle/**/*.deb
            native/target/release/bundle/**/*.AppImage
            native/target/release/bundle/**/*.exe
            native/target/release/bundle/**/*.dmg
  android:
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend
          path: native/dist
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up supported Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          # The legacy "tools" package requested by v3 is no longer published.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - run: cargo tauri android init --ci
      - name: Apply release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: python3 ../scripts/android_release.py --set-version "$RELEASE_REF"
      - name: Build optimized Android release APK
        run: cargo tauri android build --target aarch64 --apk
      - name: Verify and sign tagged APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 ../scripts/android_release.py --sign
          else
            python3 ../scripts/android_release.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && 'lethetic-Android' || 'lethetic-Android-unsigned' }}
          if-no-files-found: error
          path: native/android-release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/browser-v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lethetic-*
          path: native-artifacts
      - name: Validate installers and generate checksums
        run: python3 scripts/package_native_release.py native-artifacts native-release
      - name: Publish native installers beside the browser assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: native-release/*
          append_body: true
          body: |
            Native Web UI downloads: Windows `.exe`, macOS `.dmg`, Linux `.deb` / `.AppImage`, and Android ARM64 `.apk`. Each installer includes a SHA-256 checksum.

            The Android APK is an optimized, non-debuggable build signed with the project's release key. Desktop installers are not signed/notarized with publisher certificates. See [the native app guide](https://github.com/maxfridbe/lethetic/blob/${{ github.ref_name }}/docs/how-to/native-web-ui.md).
