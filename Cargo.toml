[workspace]
members = [".", "gemma-chat"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package]
name = "lethetic"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3"
axum = { version = "=0.8.9", features = ["ws"] }
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
chrono = "0.4.44"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.32"
pulldown-cmark = "0.13.3"
ratatui = "0.30.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
ruff_python_formatter = "=0.0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
winnow = "0.7.15"
dirs = "5.0.1"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "sync", "process", "time", "fs", "io-util", "net", "signal"] }
tokio-util = "0.7.18"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings", "serde-compat"] }
uuid = { version = "1.23.1", features = ["v4"] }
pdf_oxide = { version = "0.3", features = ["rendering"] }
image = "0.25"
libc = "0.2"
base64 = "0.22"
cookie = "=0.18.2"
diffy = "0.4"
h2m = "0.7.1"
h2m-search = "0.7.1"
hyper-util = { version = "=0.1.20", features = ["server-auto", "tokio"] }
include_dir = "=0.7.4"
gemma-chat = { path = "gemma-chat" }
meval = "0.2.0"
getrandom = "=0.4.3"
rcgen = { version = "=0.14.9", default-features = false, features = ["crypto", "ring", "zeroize"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "=2.2.0"
subtle = "=2.6.1"
url = "=2.5.8"
x509-parser = { version = "=0.18.1", features = ["verify"] }
zeroize = "=1.9.0"
zip = { version = "=8.6.0", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[[bin]]
name = "lethetic"
path = "src/bin/lethetic/main.rs"

[[bin]]
name = "lethetic-runtime"
path = "src/bin/lethetic_runtime.rs"

[[bin]]
name = "eval_scenarios"
path = "src/bin/eval_scenarios.rs"

[[bin]]
name = "playback"
path = "src/bin/playback.rs"

[[test]]
name = "live"
path = "tests/integration/main.rs"

[dev-dependencies]
tempfile = "3.10.1"
serial_test = "3.2"
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "__rustls-tls"] }
