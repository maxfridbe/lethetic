[workspace]
members = [".", "gemma-chat", "lethetic-wasm"]

# Keep useful test backtraces without duplicating full debug symbols into every
# integration-test binary.
[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package]
name = "lethetic"
version = "26.1026.4"
edition = "2024"

[features]
default = ["native"]
native = [
    "dep:async-stream",
    "dep:axum",
    "dep:axum-server",
    "dep:crossterm",
    "dep:futures-util",
    "dep:pulldown-cmark",
    "dep:ratatui",
    "dep:regex",
    "dep:reqwest",
    "dep:ruff_python_formatter",
    "dep:serde_yaml",
    "dep:sha2",
    "dep:syntect",
    "dep:winnow",
    "dep:dirs",
    "dep:tokio",
    "dep:tokio-util",
    "dep:ts-rs",
    "dep:uuid",
    "dep:pdf_oxide",
    "dep:image",
    "dep:libc",
    "dep:base64",
    "dep:cookie",
    "dep:diffy",
    "dep:h2m",
    "dep:h2m-search",
    "dep:hyper-util",
    "dep:include_dir",
    "dep:getrandom",
    "dep:rcgen",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:subtle",
    "dep:x509-parser",
    "dep:zeroize",
    "dep:zip",
    "dep:rustix",
    "dep:windows-sys",
    "chrono/clock", "gemma-chat/http",
]

[dependencies]
async-stream = { version = "0.3", optional = true }
axum = { version = "=0.8.9", features = ["ws"] , optional = true }
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] , optional = true }
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
crossterm = { version = "0.29.0", features = ["event-stream"] , optional = true }
futures-util = { version = "0.3.32", optional = true }
pulldown-cmark = { version = "0.13.3", optional = true }
ratatui = { version = "0.30.0", optional = true }
regex = { version = "1.12.3", optional = true }
reqwest = { version = "0.13.2", features = ["json", "stream"] , optional = true }
ruff_python_formatter = { version = "=0.0.10", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
turso_core = { version = "=0.8.3", default-features = false, features = ["fs", "uuid", "json", "pure-rust-crypto"] }
serde_yaml = { version = "0.9.34", optional = true }
sha2 = { version = "0.10.9", optional = true }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] , optional = true }
winnow = { version = "0.7.15", optional = true }
dirs = { version = "5.0.1", optional = true }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "sync", "process", "time", "fs", "io-util", "net", "signal"] , optional = true }
tokio-util = { version = "0.7.18", optional = true }
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings", "serde-compat"] , optional = true }
uuid = { version = "1.23.1", features = ["v4"] , optional = true }
pdf_oxide = { version = "0.3", features = ["rendering"] , optional = true }
image = { version = "0.25", optional = true }
libc = { version = "0.2", optional = true }
base64 = { version = "0.22", optional = true }
cookie = { version = "=0.18.2", optional = true }
diffy = { version = "0.4", optional = true }
h2m = { version = "0.7.1", optional = true }
h2m-search = { version = "0.7.1", optional = true }
hyper-util = { version = "=0.1.20", features = ["server-auto", "tokio"] , optional = true }
include_dir = { version = "=0.7.4", optional = true }
gemma-chat = { path = "gemma-chat", default-features = false }
# Keep the MIT-licensed evaluator line; newer releases use AGPL.
evalexpr = { version = "=11.3.1", default-features = false }
getrandom = { version = "=0.4.3", optional = true }
rcgen = { version = "=0.14.9", default-features = false, features = ["crypto", "ring", "zeroize"] , optional = true }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] , optional = true }
rustls-pemfile = { version = "=2.2.0", optional = true }
subtle = { version = "=2.6.1", optional = true }
url = "=2.5.8"
x509-parser = { version = "=0.18.1", features = ["verify"] , optional = true }
zeroize = { version = "=1.9.0", optional = true }
zip = { version = "=8.6.0", default-features = false , optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[[bin]]
required-features = ["native"]
name = "lethetic"
path = "src/bin/lethetic/main.rs"

[[bin]]
required-features = ["native"]
name = "lethetic-runtime"
path = "src/bin/lethetic_runtime.rs"

[[bin]]
required-features = ["native"]
name = "eval_scenarios"
path = "src/bin/eval_scenarios.rs"

[[bin]]
required-features = ["native"]
name = "playback"
path = "src/bin/playback.rs"

[[test]]
required-features = ["native"]
name = "live"
path = "tests/integration/main.rs"

[dev-dependencies]
tempfile = "3.10.1"
serial_test = "3.2"
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "__rustls-tls"] }
