[package]
name = "lethetic-network"
version = "26.1026.1"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.22"
# Bundled WebPKI roots also work on Android without a JVM verifier bridge.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
