[package]
name = "tauri-plugin-lethetic-host"
version = "26.1025.1"
edition = "2024"
links = "tauri-plugin-lethetic-host"
[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
[dependencies]
base64 = "0.22"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lethetic-directory = { path = "../workspace" }
lethetic-network = { path = "../network" }
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2"
keepawake = "0.6.1"
